name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
    runs-on: macos-${{ matrix.macos }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.0"
            xcode: "16.0"
            macos: "15"
          - swift: "6.1"
            xcode: "16.3"
            macos: "15"
          - swift: "6.2"
            xcode: "26.0"
            macos: "26"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Lint
        run: make lint
        env:
          CLANG_FORMAT: xcrun clang-format

      - name: Test
        run: make test

      - name: Toolchain compatibility checks
        run: swift run --package-path Tests/Compatibility

  compatibility-swift510:
    name: Swift 5.10 compatibility
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build library in Swift 5 mode
        run: swift build
      - name: Run compatibility checks without Swift Testing
        run: swift run --package-path Tests/Compatibility
      - name: Build TOML compliance harness
        run: swift build --package-path Tests/Integration

  test-linux:
    name: Swift ${{ matrix.swift-version }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift-version:
          - "6.0.3"
          - "6.1.3"
          - "6.2.3"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ matrix.swift-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Test
        run: make test
